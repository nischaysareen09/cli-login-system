services:
  app:
    build: .
    image: cli-login-system:latest
    container_name: cli-login-system
    # This is an interactive CLI, not a background server, so we keep
    # stdin open and allocate a tty. Run it with:
    #   docker-compose run --rm app
    stdin_open: true
    tty: true
    ports:
      # Bonus web UI (see README) — the CLI in your terminal remains the
      # primary interface either way. Set WEB_UI_ENABLED=false to disable.
      - "8080:8080"
    environment:
      - DB_PATH=/data/app.db
      - SESSION_TIMEOUT_MINUTES=15
      - MAX_FAILED_ATTEMPTS=5
      - LOCKOUT_DURATION_MINUTES=5
      - WEB_UI_ENABLED=true
      - WEB_UI_PORT=8080
    volumes:
      - dbdata:/data

volumes:
  dbdata:
